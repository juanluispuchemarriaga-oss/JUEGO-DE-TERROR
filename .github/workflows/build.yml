name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Godot y Android
        run: |
          echo "HOME=$HOME"
          ls /root/.local/share/godot/export_templates/ || true
          mkdir -p ~/.local/share/godot/export_templates
          if [ "$HOME" != "/root" ]; then
            cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/
          fi
          ls ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/godot
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $HOME/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          S=~/.config/godot/editor_settings-4.3.tres
          echo '[gd_resource type="EditorSettings" format=3]' > $S
          echo '[resource]' >> $S
          echo "export/android/android_sdk_path = \"${ANDROID_HOME:-/usr/lib/android-sdk}\"" >> $S
          echo "export/android/java_sdk_path = \"${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}\"" >> $S
          echo "export/android/debug_keystore = \"$HOME/debug.keystore\"" >> $S
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> $S
          echo 'export/android/debug_keystore_pass = "android"' >> $S
          cat $S

      - name: Importar recursos
        run: godot --headless --verbose --import || true

      - name: Exportar APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/CasaEmbrujada.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CasaEmbrujada-apk
          path: build/CasaEmbrujada.apk
